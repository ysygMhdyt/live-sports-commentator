<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Sports Commentator</title>
    <style>
        body {
            width: 400px;
            height: 600px;
            padding: 10px;
            font-family: Arial, sans-serif;
            margin: 0;
            /* overflow: hidden; */
            /* position: fixed; */
            background: white;
        }
        .container {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .header {
            padding: 10px;
            background: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #transcriptionContainer {
            flex: 1;
            overflow-y: auto;
            margin: 10px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 10px;
            background: #fff;
        }
        .transcription-item {
            margin-bottom: 10px;
            padding: 5px;
            border-bottom: 1px solid #eee;
        }
        .text {
            font-size: 14px;
            line-height: 1.4;
        }
        .timestamp {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
        }
        #startButton {
            padding: 8px 16px;
            background-color: #9705ea;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
        #startButton.recording {
            background-color: #7a5d8a;
        }
        #startButton:hover {
            opacity: 0.9;
        }
        .status {
            font-size: 12px;
            color: #666;
        }
        .settings {
            display: flex;
            gap: 10px;
            margin-left: 10px;
        }
        .settings select {
            padding: 6px;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div style="display: flex; align-items: center; padding-left: 10px; gap: 10px">
        <img src="icon.png" alt="Logo" style="width: 24px; height: 24px;">
        <h2>Live Sports Commentator</h2>
    </div>
    <div class="container">
        <div class="settings">
            <input 
                type="text" 
                id="settingsInput" 
                placeholder="e.g. I want to have commentation in Spanish and the style is similar to Stephen A. Smith"
                style="flex: 1; padding: 6px; border-radius: 5px; border: 1px solid #ccc; font-size: 12px;"
            >
        </div>
        <div class="header">
            <button id="startButton">Start Recording</button>
            <div class="status" id="status">Stopped</div>
        </div>
        <div id="transcriptionContainer"></div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
